# =============================================================================
# Ratana Dynamic Island & Keyboard Integration for Sway (Wayland)
# =============================================================================

# Keyboard Layout Switching (Super+Space or Alt+Shift)
bindsym $mod+space exec swaymsg input "type:keyboard" xkb_switch_layout next

# Dynamic Island - Window Management (Mac-style minimize into island)
bindsym $mod+m exec ~/.config/waybar/scripts/island-ctl windows min
bindsym $mod+Shift+m exec ~/.config/waybar/scripts/island-ctl windows manager

# Dynamic Island - Display & Mode Controls
# Toggle Show-Full mode (expands clock, full date, and full layout info)
bindsym $mod+grave exec ~/.config/waybar/scripts/island-ctl full toggle

# Dynamic Island - Menus & Actions
bindsym $mod+i exec ~/.config/waybar/scripts/island-ctl menu
bindsym $mod+d exec ~/.config/waybar/scripts/island-ctl dismiss

# Dynamic Island - Timers & Focus
bindsym $mod+p exec ~/.config/waybar/scripts/island-ctl pomodoro
bindsym $mod+t exec ~/.config/waybar/scripts/island-ctl timer 25m Focus
bindsym $mod+Shift+t exec ~/.config/waybar/scripts/island-ctl stop
