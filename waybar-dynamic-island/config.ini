# =============================================================================
# RATANA DYNAMIC ISLAND — CONFIGURATION FILE
# =============================================================================
# Located at ~/.config/ratana-island/config.ini
# =============================================================================

[General]
# Active Edition Mode: waybar-lite | waybar-enhanced | quickshell | hybrid
mode = waybar-enhanced

# Active Theme: macos-black | catppuccin-mocha | macos-glass | minimal
theme = macos-glass

# Presentation Mode:
#   stable-width   - Recommended default for Waybar. Fixed outer pill width,
#                    zero width jitter or text jumping.
#   content-width  - Dynamically morphs width per state. May exhibit slight
#                    text jitter in Waybar as digits count up/down.
presentation_mode = stable-width

# Show Full / Expanded Presentation Mode (disables ellipsis truncation)
show_full = false

# Outer pill dimensions (pixels)
compact_width = 160
expanded_width = 280

# Monitor selection: leave empty for auto/primary, or specify output name (e.g. eDP-1, DP-1)
monitor =

# Frontend Edition:
#   waybar      - Lightweight, zero Qt dependency, centered pill in Waybar.
#   quickshell  - Native animated layer-shell overlay with smooth capsule morphing.
#   hybrid      - Quickshell floating island + Waybar standard desktop panels.
frontend = waybar

# Accessibility & Animation
reduced_motion = false
animation_duration = 260
spring_overshoot = 1.05

[Integrations]
# Enable / disable individual event listeners
enable_media = true
enable_volume = true
enable_brightness = true
enable_notifications = true
enable_battery = true
enable_recording = true
enable_network = true
enable_clipboard = true
enable_timer = true
enable_language = true

# Language / Keyboard Layout Settings
# language_format: both | origin | full | short
#   both   -> ភាសាខ្មែរ (KH) / English (US)
#   origin -> ភាសាខ្មែរ / English
#   full   -> Khmer (Cambodia) / English (US)
#   short  -> KH / US
idle_show_language = true
language_format = both
language_timeout_s = 2.0

# Privacy Settings
# network_ssid_privacy: true hides the Wi-Fi network name ("Wi-Fi Connected")
#                       false shows the SSID ("Wi-Fi: MyHome")
network_ssid_privacy = true

# clipboard_privacy: strictly emits generic "Copied" indicator without ever
#                    reading, storing, or logging clipboard text.
clipboard_privacy = true

# Preferred Quick Actions Menu Launcher: auto | fuzzel | rofi | wofi
preferred_menu = auto

# Event Dismissal Durations (seconds)
volume_timeout_s = 1.5
brightness_timeout_s = 1.5
notification_timeout_s = 4.0
urgent_notification_timeout_s = 6.0
network_timeout_s = 3.0
clipboard_timeout_s = 2.0
charging_timeout_s = 3.0
battery_low_threshold = 15

[Recording]
# Screen recording binaries to watch (comma-separated process names)
recorders = wf-recorder,wl-screenrec,gpu-screen-recorder,obs

# Optional OBS Studio WebSocket v5 connection (for confirmed recording status)
obs_websocket_enabled = false
obs_websocket_url = ws://127.0.0.1:4455
obs_websocket_password =
