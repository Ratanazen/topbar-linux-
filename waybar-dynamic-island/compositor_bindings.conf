# =============================================================================
# HYPRLAND & SWAY CONFIGURATION SNIPPETS FOR DYNAMIC ISLAND
# =============================================================================

# -----------------------------------------------------------------------------
# 1. HYPRLAND CONFIGURATION (~/.config/hypr/hyprland.conf)
# -----------------------------------------------------------------------------
# Autostart daemon (Only necessary if you use Option B with systemd or separate process)
# If your Waybar config runs "exec": ".../island-daemon.py", you DO NOT need exec-once.
# If using standalone or systemd:
# exec-once = systemctl --user start island.service

# Compositor Layer Blur (Gives Waybar and Dynamic Island authentic glass blur)
# layerrule = blur, waybar
# layerrule = ignorezero, waybar

# Dynamic Island Keybindings
bind = $mainMod, P, exec, ~/.config/waybar/scripts/island-ctl pomodoro
bind = $mainMod, T, exec, ~/.config/waybar/scripts/island-ctl timer 25m Focus
bind = $mainMod SHIFT, T, exec, ~/.config/waybar/scripts/island-ctl stop
bind = $mainMod, I, exec, ~/.config/waybar/scripts/island-ctl menu
bind = $mainMod, D, exec, ~/.config/waybar/scripts/island-ctl dismiss

# Quick Media & Volume Controls (Syncs instantly with Dynamic Island)
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +2%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -2%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle


# -----------------------------------------------------------------------------
# 2. SWAY / SWAYFX CONFIGURATION (~/.config/sway/config)
# -----------------------------------------------------------------------------
# SwayFX Glass Blur (Under SwayFX, enable blur for Waybar layer surfaces):
# layer_effects "waybar" blur enable; blur_passes 3; blur_radius 5;

# Dynamic Island Keybindings
bindsym $mod+p exec ~/.config/waybar/scripts/island-ctl pomodoro
bindsym $mod+t exec ~/.config/waybar/scripts/island-ctl timer 25m Focus
bindsym $mod+Shift+t exec ~/.config/waybar/scripts/island-ctl stop
bindsym $mod+i exec ~/.config/waybar/scripts/island-ctl menu
bindsym $mod+d exec ~/.config/waybar/scripts/island-ctl dismiss

# Hardware Keys
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +2%
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -2%
bindsym XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
